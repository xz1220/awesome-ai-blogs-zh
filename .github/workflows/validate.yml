name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r scripts/requirements-images.txt
      - run: python scripts/build_index.py --check
      - run: python scripts/check_links.py
      - run: python scripts/check_images.py
